name: Build YlowstoneTV APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (Android 10-17 & Android TV)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Compressed Release APK (R8 + Shrink)
        run: gradle assembleRelease --stacktrace

      - name: Prepare Final APK
        run: |
          mkdir -p dist
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          APK_PATH="dist/YlowstoneTV-v${VERSION}-by-ylowstone.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_PATH"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          echo "Built $APK_PATH ($APK_SIZE)"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: YlowstoneTV v${{ env.APP_VERSION }}
          body: |
            ## YlowstoneTV v${{ env.APP_VERSION }} (by ylowstone)
            - **APK Size:** ${{ env.APK_SIZE }} (R8 code minification & resource shrinking)
            - **Ylowstone Signature Bento Home:** Palet warna senada *splash screen* (AMOLED + Smoked Olive & Amber Sunstone), tata letak Bento asimetris (TV kiri tinggi, Film & Seri kanan tumpuk), dan logo `Y` polos melayang tanpa tombol *search*
            - **Animasi Loading Bumerang (3 Gaya):** Indikator memuat/sync 60fps *native* ala Motorola Edge 60 Fusion (*Bumerang Moto*, *Bumerang Amber*, *Bumerang Aurora*) yang bisa dipilih di Pengaturan
            - **Menu Tekan Lama 3-in-1 & Kategori Tontonan:** Salin link (preview tersamar), cek status stream (*Aktif / Delay / Mati*), dan kurasi grup tontonan (*Sports*, *Event Pertandingan*, *Daftar Tontonan*) dengan tombol *Show/Hide* di Beranda
            - **Split-Screen Player & Floating/PiP Minimalis:** Pemutar setengah layar responsif (Ponsel & Android TV) plus jendela mengambang/PiP ringkas 3 kontrol (**Layar Penuh**, **Play/Pause**, **Tutup X**)
            - **Navigasi & Streaming Lebih Halus:** *Sync* murni 1 playlist aktif, *Back* berjenjang tanpa *pop-up* (posisi scroll kategori tetap nempel), Auto-Subtitle Film/Seri, *Buffer Profile*, dan *Auto-Reconnect* Live TV
          files: dist/*.apk
