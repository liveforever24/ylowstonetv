name: Build YlowstoneTV APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (Android 10-17 & Android TV)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Compressed Release APK (R8 + Shrink)
        run: gradle assembleRelease --stacktrace

      - name: Prepare Final APK
        run: |
          mkdir -p dist
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          APK_PATH="dist/YlowstoneTV-v${VERSION}-by-ylowstone.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_PATH"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          echo "Built $APK_PATH ($APK_SIZE)"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: YlowstoneTV v${{ env.APP_VERSION }}
          body: |
            ## YlowstoneTV v${{ env.APP_VERSION }} (by ylowstone)
            - **APK Size:** ${{ env.APK_SIZE }} (R8 code minification, resource shrinking & locale optimization — 100% full features & aesthetics intact)
            - Removed Welcome & Quick Guide replay option from Settings (now shown strictly on fresh install or after Clear Data)
            - Vercel Admin Login (fixed `YlowstoneTV` username + 4-digit PIN), remote playlist sync & protected credentials
            - FotMob-inspired flat navigation bar, Google Pixel Fog theme (System / Light / Dark AMOLED), drag-only seekbar & 12 3D App Icons
          files: dist/*.apk
