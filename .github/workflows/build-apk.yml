name: Build YlowstoneTV APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (Android 10-17 & Android TV)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare Final APK
        run: |
          mkdir -p dist
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk "dist/YlowstoneTV-v${VERSION}-by-ylowstone.apk"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YlowstoneTV-v${{ env.APP_VERSION }}-APK
          path: dist/*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: YlowstoneTV v${{ env.APP_VERSION }}
          body: |
            ## YlowstoneTV v${{ env.APP_VERSION }} (by ylowstone)
            - Clean FotMob-inspired flat navigation bar & Google Pixel Fog color system (System / Light / Dark AMOLED)
            - Drag-only anti-accidental-tap seekbar + double-tap ±10s skip for Movies & Series
            - Streamlined Smarters-style player controls + subtle 2-line 24h digital clock on tap
            - Category 4-digit PIN management & Reset PIN inside Settings
            - Fullscreen portrait animated Splash Screen + Double-tap Back to Exit
            - First-launch Welcome Quote pop-up & 4-step Quick Guide with automatic system language detection
          files: dist/*.apk
