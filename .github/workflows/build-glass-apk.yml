name: Build YlowstoneTVglass APK (Android 10-17 & Android TV)

on:
  push:
    branches:
      - glass
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-glass:
    name: Build YlowstoneTVglass APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare YlowstoneTVglass Release APK
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/release/app-release.apk release-out/YlowstoneTVglass-v2.5.3.apk
          ls -lh release-out/YlowstoneTVglass-v2.5.3.apk

      - name: Publish YlowstoneTVglass GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.3-glass
          name: YlowstoneTVglass v2.5.3 (Liquid Glass Edition)
          body: |
            Clone edisi **YlowstoneTVglass v2.5.3** (`com.ylowstone.tv.glass`) — dapat diinstall berdampingan dengan YlowstoneTV utama.
            - Beranda Dark Mode Editorial Carousel + Collapsing Large Title (`Home`)
            - Floating Liquid Glass Navigation Dock khusus Ponsel/Tablet (Mode Android TV tetap D-Pad)
            - Seluruh inti `v2.5.3` utuh (`UniversalStreamStabilizer v2.0`, AES-256-GCM, Skip Intro MM:SS, Playlist Health Inspector, & Antrean Episode Seri)
          files: release-out/YlowstoneTVglass-v2.5.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
